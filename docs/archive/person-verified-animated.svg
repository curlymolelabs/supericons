<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" class="korvic si-premium-standalone-root"><style>/* Security &amp; Auth Collection: CSS-only hover animations
   Source: Material Symbols Rounded (solid/filled)
   
   DESIGN RULE: Every animation tells a security story.
   Motion vocabulary: lock mechanisms, biometric scans,
   encryption transforms, shield deflections, access grants. */

svg.si-premium-standalone-root { overflow: visible; }

/* 24. PERSON-VERIFIED: Identity confirm. Scales with green radiance burst on confirmation. */
svg.si-premium-standalone-root {
  animation: rocf3l 0.37s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  transform-origin: center;
}

/* 24. Identity confirm: scales with green radiance burst */
@keyframes rocf3l {
  0%   { transform: scale(1); filter: brightness(1) drop-shadow(0 0 0 transparent); }
  20%  { transform: scale(0.88); filter: brightness(0.7); }
  40%  { transform: scale(0.92); filter: brightness(0.9) drop-shadow(0 0 2px rgba(34,197,94,0.2)); }
  55%  { transform: scale(1.1); filter: brightness(2.0) drop-shadow(0 0 14px rgba(34,197,94,0.7)); }
  70%  { transform: scale(1.04); filter: brightness(1.3) drop-shadow(0 0 6px rgba(34,197,94,0.3)); }
  85%  { transform: scale(0.99); filter: brightness(1.1); }
  100% { transform: scale(1); filter: brightness(1) drop-shadow(0 0 0 transparent); }
}</style>
