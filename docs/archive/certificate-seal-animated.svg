<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" class="q91nh5 si-premium-standalone-root"><style>/* Security & Auth Collection: CSS-only hover animations
   Source: Material Symbols Rounded (solid/filled)
   
   DESIGN RULE: Every animation tells a security story.
   Motion vocabulary: lock mechanisms, biometric scans,
   encryption transforms, shield deflections, access grants. */

svg.si-premium-standalone-root { overflow: visible; }

/* 15. CERTIFICATE-SEAL: Emboss press. 3D depth press like stamping a wax seal. */
svg.si-premium-standalone-root:hover {
  animation: zqr8yb 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  transform-origin: center;
}

/* 15. Emboss press: 3D wax seal press */
@keyframes zqr8yb {
  0%   { transform: perspective(200px) rotateX(0deg) translateZ(0) scale(1); filter: brightness(1); }
  25%  { transform: perspective(200px) rotateX(-15deg) translateZ(-10px) scale(0.9); filter: brightness(0.7); }
  45%  { transform: perspective(200px) rotateX(-20deg) translateZ(-15px) scale(0.85); filter: brightness(0.5); }
  60%  { transform: perspective(200px) rotateX(5deg) translateZ(8px) scale(1.06); filter: brightness(1.8) drop-shadow(0 0 10px rgba(251,191,36,0.5)); }
  80%  { transform: perspective(200px) rotateX(2deg) translateZ(2px) scale(1.02); filter: brightness(1.2); }
  100% { transform: perspective(200px) rotateX(0deg) translateZ(0) scale(1); filter: brightness(1); }
}</style>
