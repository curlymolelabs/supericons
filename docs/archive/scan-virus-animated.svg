<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" class="o1yrc1 si-premium-standalone-root"><style>/* Security &amp; Auth Collection: CSS-only hover animations
   Source: Material Symbols Rounded (solid/filled)
   
   DESIGN RULE: Every animation tells a security story.
   Motion vocabulary: lock mechanisms, biometric scans,
   encryption transforms, shield deflections, access grants. */

svg.si-premium-standalone-root { overflow: visible; }

/* 18. SCAN-VIRUS: Threat detect. Tremor + red flash like detecting a threat. */
svg.si-premium-standalone-root {
  animation: ivmcjs 0.55s ease forwards;
  transform-origin: center;
}

/* 18. Threat detect: tremor + escalating red flash */
@keyframes ivmcjs {
  0%   { transform: translate(0, 0) scale(1); filter: brightness(1) drop-shadow(0 0 0 transparent); }
  10%  { transform: translate(2px, -1px) scale(1.02); filter: brightness(1.3) drop-shadow(0 0 4px rgba(239,68,68,0.3)); }
  20%  { transform: translate(-2px, 1px) scale(1); filter: brightness(0.9); }
  30%  { transform: translate(1px, 1px) scale(1.03); filter: brightness(1.5) drop-shadow(0 0 6px rgba(239,68,68,0.4)); }
  40%  { transform: translate(-1px, -1px) scale(1); filter: brightness(0.85); }
  50%  { transform: translate(1.5px, 0.5px) scale(1.04); filter: brightness(1.7) drop-shadow(0 0 10px rgba(239,68,68,0.6)); }
  65%  { transform: translate(-0.5px, 0.5px) scale(1.01); filter: brightness(1.2) drop-shadow(0 0 4px rgba(239,68,68,0.2)); }
  100% { transform: translate(0, 0) scale(1); filter: brightness(1) drop-shadow(0 0 0 transparent); }
}</style>
