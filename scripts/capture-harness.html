<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 56px;
    height: 56px;
    background: #1a1919;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .si-anim {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 56px;
    height: 56px;
    flex-shrink: 0;
  }
  .si-anim svg {
    overflow: visible;
    width: 56px;
    height: 56px;
    display: block;
    flex-shrink: 0;
  }

  /* agent-workflow animation - activated by .hovered class (for Playwright control) */
  .hovered .si-anim--agent-workflow .si-agwf-n1 {
    animation: si-wf-pulse 0.4s ease both;
  }
  .hovered .si-anim--agent-workflow .si-agwf-link1 {
    animation: si2-link-draw 0.2s ease 0.15s both;
  }
  .hovered .si-anim--agent-workflow .si-agwf-n2 {
    animation: si-wf-pulse 0.4s ease 0.2s both;
  }
  .hovered .si-anim--agent-workflow .si-agwf-link2 {
    animation: si2-link-draw 0.2s ease 0.25s both;
  }
  .hovered .si-anim--agent-workflow .si-agwf-n3 {
    animation: si-wf-pulse 0.4s ease 0.35s both;
  }
  .hovered .si-anim--agent-workflow .si-agwf-link3 {
    animation: si2-link-draw 0.2s ease 0.4s both;
  }
  .hovered .si-anim--agent-workflow .si-agwf-link4 {
    animation: si2-link-draw 0.2s ease 0.45s both;
  }
  .hovered .si-anim--agent-workflow .si-agwf-n4 {
    animation: si-wf-pulse 0.4s ease 0.5s both;
  }
  @keyframes si-wf-pulse {
    0%   { opacity: 0.3; transform: scale(0.8); }
    50%  { opacity: 1;   transform: scale(1.2); }
    100% { opacity: 0.8; transform: scale(1); }
  }
  @keyframes si2-link-draw {
    0%   { opacity: 0; }
    100% { opacity: 0.7; }
  }
</style>
</head>
<body>
  <div id="cell">
    <div class="si-anim si-anim--agent-workflow">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
        <!-- Node 1 (top-left, cx=4): #00D4FF (gradient start) -->
        <circle class="si-agwf-n1" cx="4" cy="12" r="2.5" fill="#00D4FF"/>
        <!-- Node 2 (center-top, cx=12): midpoint ~#6E9AFF -->
        <circle class="si-agwf-n2" cx="12" cy="6" r="2.5" fill="#6E9AFF" opacity="0.9"/>
        <!-- Node 3 (center-bottom): #7B61FF (gradient end) -->
        <circle class="si-agwf-n3" cx="12" cy="18" r="2.5" fill="#7B61FF" opacity="0.9"/>
        <!-- Node 4 (right, cx=20): #00D4FF -->
        <circle class="si-agwf-n4" cx="20" cy="12" r="2.5" fill="#00D4FF" opacity="0.9"/>
        <path class="si-agwf-link1" d="M6 11l4-4" stroke="#00D4FF" stroke-width="1" opacity="0.6"/>
        <path class="si-agwf-link2" d="M6 13l4 4" stroke="#7B61FF" stroke-width="1" opacity="0.6"/>
        <path class="si-agwf-link3" d="M14 7l4 4" stroke="#00D4FF" stroke-width="1" opacity="0.6"/>
        <path class="si-agwf-link4" d="M14 17l4-4" stroke="#7B61FF" stroke-width="1" opacity="0.6"/>
      </svg>
    </div>
  </div>
  <script>
    window.captureReady = true;
  </script>
</body>
</html>
