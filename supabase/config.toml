# Supabase Edge Function deployment settings.
#
# Stripe webhooks authenticate with the Stripe-Signature header inside the
# function, so Supabase JWT verification must stay off for this endpoint.
[functions.stripe-webhook]
verify_jwt = false

# x402 buyers and agents must reach this endpoint without a Supabase JWT so the
# function can answer with HTTP 402 payment terms. Payment authenticity is
# enforced inside the function with signed x402 payment verification.
[functions.x402-premium-icon]
verify_jwt = false

# This endpoint is isolated from the production MCP search path. Beta identity
# and measurement are enforced inside the shared search handler.
[functions.mcp-search-v2-beta]
verify_jwt = false

[functions.mcp-search-v2-recommend-treatment]
verify_jwt = false

# Public MCP clients reach this stable search endpoint without a Supabase JWT.
# Product API keys and paid access are enforced inside the MCP server.
[functions.mcp-search]
verify_jwt = false

# Recommendation clients use this additive endpoint for grouped searches. The
# stable mcp-search endpoint remains available for individual-request fallback.
[functions.mcp-search-grouped]
verify_jwt = false

# The local MCP package uses this endpoint to fetch Material SVG snapshots on
# cache misses. The function only serves the fixed public Material presets.
[functions.serve-material-snapshot]
verify_jwt = false
