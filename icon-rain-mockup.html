<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Icon Rain Background - Mockup</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ============================================================
           DESIGN TOKENS
           ============================================================ */
        :root {
            --bg-primary: #0a0a0a;
            --bg-hero-grad-start: rgba(10, 10, 10, 0);
            --bg-hero-grad-end: #0a0a0a;
            --icon-rain-color: rgba(255, 255, 255, 0.06);
            --icon-rain-highlight: rgba(255, 255, 255, 0.14);
            --text-primary: #f0f0f0;
            --text-secondary: rgba(255, 255, 255, 0.5);
            --accent: #818cf8;
            --accent-glow: rgba(129, 140, 248, 0.15);
            --icon-size: 22px;
            --column-gap: 56px;
            --row-gap: 48px;
        }

        /* ============================================================
           RESET & BASE
           ============================================================ */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Space Grotesk', system-ui, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* ============================================================
           HERO SECTION (container for rain + content)
           ============================================================ */
        .hero {
            position: relative;
            width: 100%;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* ============================================================
           ICON RAIN LAYER
           Sits behind hero content. CSS-only approach:
           - A canvas of icon columns created by JS
           - Each icon fades in/out with staggered animation-delay
           - Columns scroll upward at different speeds
           ============================================================ */
        .icon-rain {
            position: absolute;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .icon-rain__column {
            position: absolute;
            top: 0;
            display: flex;
            flex-direction: column;
            gap: var(--row-gap);
            animation: rain-drift linear infinite;
            will-change: transform;
        }

        @keyframes rain-drift {
            0%   { transform: translateY(0); }
            100% { transform: translateY(calc(-1 * (var(--icon-size) + var(--row-gap)) * var(--icon-count))); }
        }

        .icon-rain__cell {
            width: var(--icon-size);
            height: var(--icon-size);
            opacity: 0;
            animation: icon-blink ease-in-out infinite;
            will-change: opacity;
        }

        .icon-rain__cell svg {
            width: 100%;
            height: 100%;
            fill: var(--icon-rain-color);
            transition: fill 0.6s ease;
        }

        /* Occasional brighter "pulse" variant */
        .icon-rain__cell--bright svg {
            fill: var(--icon-rain-highlight);
        }

        @keyframes icon-blink {
            0%, 100% { opacity: 0; }
            30%      { opacity: 1; }
            70%      { opacity: 1; }
            85%      { opacity: 0.4; }
        }

        /* Fade edges so columns dissolve at top/bottom */
        .icon-rain::before,
        .icon-rain::after {
            content: '';
            position: absolute;
            left: 0; right: 0;
            height: 25%;
            z-index: 1;
            pointer-events: none;
        }
        .icon-rain::before {
            top: 0;
            background: linear-gradient(to bottom, var(--bg-primary) 0%, transparent 100%);
        }
        .icon-rain::after {
            bottom: 0;
            background: linear-gradient(to top, var(--bg-primary) 0%, transparent 100%);
        }

        /* ============================================================
           HERO CONTENT
           ============================================================ */
        .hero__content {
            position: relative;
            z-index: 2;
            text-align: center;
            max-width: 680px;
            padding: 2rem;
        }

        .hero__h1 {
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 700;
            letter-spacing: -0.03em;
            line-height: 1.15;
            margin-bottom: 1rem;
        }

        .hero__subtitle {
            font-size: clamp(0.95rem, 1.8vw, 1.15rem);
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 2rem;
            max-width: 520px;
            margin-inline: auto;
        }

        .hero__btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 28px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 0 24px var(--accent-glow), 0 2px 8px rgba(0,0,0,0.3);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .hero__btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 0 40px var(--accent-glow), 0 4px 16px rgba(0,0,0,0.4);
        }

        .hero__stats {
            display: flex;
            justify-content: center;
            gap: 2.5rem;
            margin-top: 2.5rem;
        }
        .hero__stat-num {
            display: block;
            font-size: 1.5rem;
            font-weight: 700;
        }
        .hero__stat-label {
            display: block;
            font-size: 0.78rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-top: 2px;
        }

        /* ============================================================
           CONTROLS (mockup tuning panel)
           ============================================================ */
        .controls {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 100;
            background: rgba(30,30,30,0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            font-size: 0.8rem;
            color: var(--text-secondary);
            min-width: 220px;
        }
        .controls label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }
        .controls input[type="range"] {
            width: 100px;
            accent-color: var(--accent);
        }
        .controls__title {
            font-weight: 600;
            color: var(--text-primary);
            font-size: 0.85rem;
            margin-bottom: 4px;
        }
    </style>
</head>
<body>

<section class="hero" id="hero">
    <!-- Icon rain background layer -->
    <div class="icon-rain" id="iconRain"></div>

    <!-- Hero content (same structure as current Supericons landing) -->
    <div class="hero__content">
        <h1 class="hero__h1">20,000+ free icons,<br>one search.</h1>
        <p class="hero__subtitle">10 libraries. AI semantic search. React, Vue, Svelte export. Customize colors, sizes, and containers.</p>
        <button class="hero__btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            Start searching
        </button>
        <div class="hero__stats">
            <div><span class="hero__stat-num">20,000+</span><span class="hero__stat-label">Icons</span></div>
            <div><span class="hero__stat-num">10</span><span class="hero__stat-label">Libraries</span></div>
            <div><span class="hero__stat-num">5</span><span class="hero__stat-label">Formats</span></div>
            <div><span class="hero__stat-num">1</span><span class="hero__stat-label">MCP Server</span></div>
        </div>
    </div>
</section>

<!-- Tuning controls for the mockup -->
<div class="controls" id="controls">
    <div class="controls__title">Icon Rain Controls</div>
    <label>
        Base opacity
        <input type="range" id="ctrlOpacity" min="1" max="20" value="6">
    </label>
    <label>
        Highlight opacity
        <input type="range" id="ctrlHighlight" min="5" max="30" value="14">
    </label>
    <label>
        Blink speed (s)
        <input type="range" id="ctrlSpeed" min="2" max="12" value="5" step="0.5">
    </label>
    <label>
        Drift speed (s)
        <input type="range" id="ctrlDrift" min="15" max="120" value="45" step="5">
    </label>
    <label>
        Column count
        <input type="range" id="ctrlColumns" min="6" max="30" value="16">
    </label>
    <label>
        Icons per column
        <input type="range" id="ctrlRows" min="6" max="24" value="12">
    </label>
</div>

<script>
// ===================================================================
// ICON SVG PATH DATA (24x24 viewBox, Lucide-style stroked icons)
// ===================================================================
const ICON_PATHS = [

    // star
    '<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>',
    // home
    '<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>',
    // settings (gear)
    '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>',
    // user
    '<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
    // mail
    '<path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/>',
    // bell
    '<path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>',
    // lock
    '<rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
    // search
    '<circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>',
    // camera
    '<path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/>',
    // zap
    '<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>',
    // globe
    '<circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>',
    // code
    '<polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/>',
    // download
    '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>',
    // shield
    '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',
    // layout
    '<rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/>',
    // moon
    '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>',
    // sun
    '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>',
    // layers
    '<polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/>',
    // clipboard
    '<path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/>',
    // cloud
    '<path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/>',
    // compass
    '<circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/>',
    // cpu
    '<rect x="4" y="4" width="16" height="16" rx="2" ry="2"/><rect x="9" y="9" width="6" height="6"/><line x1="9" y1="1" x2="9" y2="4"/><line x1="15" y1="1" x2="15" y2="4"/><line x1="9" y1="20" x2="9" y2="23"/><line x1="15" y1="20" x2="15" y2="23"/><line x1="20" y1="9" x2="23" y2="9"/><line x1="20" y1="14" x2="23" y2="14"/><line x1="1" y1="9" x2="4" y2="9"/><line x1="1" y1="14" x2="4" y2="14"/>',
    // eye
    '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>',
    // flag
    '<path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/>',
    // gift
    '<polyline points="20 12 20 22 4 22 4 12"/><rect x="2" y="7" width="20" height="5"/><line x1="12" y1="22" x2="12" y2="7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/>',
    // key
    '<path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/>',
    // wifi
    '<path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/>',
    // music
    '<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',
    // hash
    '<line x1="4" y1="9" x2="20" y2="9"/><line x1="4" y1="15" x2="20" y2="15"/><line x1="10" y1="3" x2="8" y2="21"/><line x1="16" y1="3" x2="14" y2="21"/>',
];

// ===================================================================
// CONFIGURATION
// ===================================================================
let CONFIG = {
    columns: 16,
    iconsPerColumn: 12,
    baseOpacity: 0.06,
    highlightOpacity: 0.14,
    blinkDuration: 5,    // seconds per blink cycle
    driftDuration: 45,   // seconds for full column scroll
    brightChance: 0.12,  // 12% of icons get brighter pulse
};

// ===================================================================
// RENDERER
// ===================================================================
function buildRain() {
    const container = document.getElementById('iconRain');
    container.innerHTML = '';

    const viewW = window.innerWidth;
    const totalWidth = CONFIG.columns * parseInt(getComputedStyle(document.documentElement).getPropertyValue('--column-gap'));
    const startX = (viewW - totalWidth) / 2;

    for (let col = 0; col < CONFIG.columns; col++) {
        const colEl = document.createElement('div');
        colEl.className = 'icon-rain__column';
        colEl.style.left = `${startX + col * 56}px`;
        colEl.style.setProperty('--icon-count', CONFIG.iconsPerColumn);

        // Randomize drift speed per column (+/- 30%)
        const driftVariance = 0.7 + Math.random() * 0.6;
        colEl.style.animationDuration = `${CONFIG.driftDuration * driftVariance}s`;

        // Offset start so columns don't sync
        colEl.style.animationDelay = `${-Math.random() * CONFIG.driftDuration}s`;

        // Double the icons so the loop is seamless
        const count = CONFIG.iconsPerColumn * 2;
        for (let row = 0; row < count; row++) {
            const cell = document.createElement('div');
            cell.className = 'icon-rain__cell';

            // Random icon
            const pathIdx = Math.floor(Math.random() * ICON_PATHS.length);
            const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            svg.setAttribute('viewBox', '0 0 24 24');
            svg.setAttribute('fill', 'none');
            svg.setAttribute('stroke', 'currentColor');
            svg.setAttribute('stroke-width', '1.5');
            svg.setAttribute('stroke-linecap', 'round');
            svg.setAttribute('stroke-linejoin', 'round');
            svg.style.color = Math.random() < CONFIG.brightChance
                ? `rgba(255,255,255,${CONFIG.highlightOpacity})`
                : `rgba(255,255,255,${CONFIG.baseOpacity})`;
            // Use fill none, stroke for color
            svg.style.fill = 'none';
            svg.style.stroke = svg.style.color;
            svg.innerHTML = ICON_PATHS[pathIdx];
            cell.appendChild(svg);

            // Stagger blink timing
            const blinkVariance = 0.6 + Math.random() * 0.8;
            cell.style.animationDuration = `${CONFIG.blinkDuration * blinkVariance}s`;
            cell.style.animationDelay = `${Math.random() * CONFIG.blinkDuration * 2}s`;

            colEl.appendChild(cell);
        }

        container.appendChild(colEl);
    }
}

// ===================================================================
// CONTROLS WIRING
// ===================================================================
function wireControls() {
    const get = id => document.getElementById(id);
    const rebuild = () => buildRain();

    get('ctrlOpacity').addEventListener('input', e => {
        CONFIG.baseOpacity = parseInt(e.target.value) / 100;
        rebuild();
    });
    get('ctrlHighlight').addEventListener('input', e => {
        CONFIG.highlightOpacity = parseInt(e.target.value) / 100;
        rebuild();
    });
    get('ctrlSpeed').addEventListener('input', e => {
        CONFIG.blinkDuration = parseFloat(e.target.value);
        rebuild();
    });
    get('ctrlDrift').addEventListener('input', e => {
        CONFIG.driftDuration = parseInt(e.target.value);
        rebuild();
    });
    get('ctrlColumns').addEventListener('input', e => {
        CONFIG.columns = parseInt(e.target.value);
        rebuild();
    });
    get('ctrlRows').addEventListener('input', e => {
        CONFIG.iconsPerColumn = parseInt(e.target.value);
        rebuild();
    });
}

// ===================================================================
// INIT
// ===================================================================
window.addEventListener('DOMContentLoaded', () => {
    buildRain();
    wireControls();
});

// Rebuild on resize (debounced)
let resizeTimer;
window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(buildRain, 200);
});
</script>

</body>
</html>
