<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Supericons Sidebar Mockup</title>
  <style>
    :root {
      --bg: #0e0e0e;
      --surface: #131313;
      --surface-hover: #25160f;
      --border: rgba(72, 72, 71, 0.26);
      --text: #ffffff;
      --text-muted: #cccaca;
      --text-dim: #767575;
      --brand: #ff4f00;
      --brand-soft: #ff906c;
      --font-body: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-label: Inter, ui-sans-serif, system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
    }

    body {
      display: grid;
      place-items: start center;
      padding: 0;
    }

    .mockup-shell {
      width: 241px;
      min-height: 626px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      overflow: hidden;
    }

    .mockup-header {
      display: flex;
      align-items: center;
      gap: 10px;
      height: 57px;
      padding: 0 18px 0 24px;
      border-bottom: 1px solid rgba(72, 72, 71, 0.2);
      background: #101010;
    }

    .brand-logo {
      width: 20px;
      height: 14px;
      flex: 0 0 auto;
    }

    .brand-name {
      color: var(--brand);
      font-size: 21px;
      font-style: italic;
      font-weight: 900;
      letter-spacing: -0.04em;
      line-height: 1;
    }

    .search-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 41px;
      height: 36px;
      margin-left: auto;
      border-radius: 11px;
      background: #1a1919;
      color: var(--text-dim);
      transform: translateX(20px);
    }

    .sidebar {
      padding: 20px 0 14px;
    }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 24px 6px;
      color: var(--text-muted);
      font-family: var(--font-label);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
      line-height: 1;
      text-transform: uppercase;
    }

    .section-title--premium {
      color: var(--brand);
      padding-top: 12px;
    }

    .section-chevron {
      color: var(--text-muted);
      transform: translateY(-1px);
    }

    .sidebar-row {
      position: relative;
      display: flex;
      align-items: center;
      gap: 12px;
      height: 31px;
      padding: 0 24px;
      color: var(--text-muted);
      font-size: 13px;
      line-height: 1;
      cursor: default;
      transition: background 150ms ease, color 150ms ease;
    }

    .sidebar-row:hover {
      background: var(--surface-hover);
      color: var(--brand-soft);
    }

    .sidebar-row--active {
      color: var(--brand);
      background: rgba(255, 79, 0, 0.05);
      border-left: 2px solid var(--brand);
      padding-left: 22px;
    }

    .sidebar-row__icon {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      flex: 0 0 18px;
      color: currentColor;
      opacity: 0.66;
      overflow: visible;
    }

    .sidebar-row:hover .sidebar-row__icon,
    .sidebar-row--active .sidebar-row__icon {
      opacity: 1;
    }

    .sidebar-row__name {
      min-width: 0;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .sidebar-row__count {
      min-width: 38px;
      color: var(--text-dim);
      font-family: var(--font-label);
      font-size: 11px;
      line-height: 1;
      text-align: right;
    }

    .divider {
      height: 1px;
      margin: 7px 24px;
      background: var(--border);
    }

    .line-icon {
      width: 18px;
      height: 18px;
      display: block;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.5;
      overflow: visible;
    }

    .fill-icon {
      width: 18px;
      height: 18px;
      display: block;
      fill: currentColor;
      overflow: visible;
    }

    .supericons-motion {
      position: relative;
      width: 20px;
      height: 14px;
      overflow: visible;
      transform-origin: center;
      will-change: transform, filter;
      z-index: 1;
    }

    .supericons-motion__logo,
    .supericons-motion__trail {
      transform-box: fill-box;
      transform-origin: center;
    }

    .supericons-motion__trail {
      opacity: 0;
      fill: var(--brand);
    }

    .supericons-motion__logo {
      fill: currentColor;
      transition: fill 150ms ease;
    }

    .supericons-speed-streak {
      position: absolute;
      left: -21px;
      display: block;
      height: 2px;
      border-radius: 999px;
      background: linear-gradient(90deg, rgba(255, 79, 0, 0), rgba(255, 79, 0, 0.76), rgba(255, 144, 108, 0.95));
      opacity: 0;
      pointer-events: none;
      transform: translateX(0) scaleX(0.35);
      transform-origin: right center;
      z-index: 0;
    }

    .supericons-speed-streak--1 {
      top: 3px;
      width: 17px;
    }

    .supericons-speed-streak--2 {
      top: 7px;
      left: -24px;
      width: 22px;
    }

    .supericons-speed-streak--3 {
      top: 11px;
      width: 14px;
    }

    .supericons-speed-streak--4 {
      top: 1px;
      left: -13px;
      width: 8px;
      height: 1.5px;
      background: linear-gradient(90deg, rgba(255, 144, 108, 0), rgba(255, 144, 108, 0.82));
    }

    .sidebar-row--supericons:hover {
      color: var(--brand);
    }

    .sidebar-row--supericons:hover .supericons-motion {
      filter: drop-shadow(0 0 8px rgba(255, 79, 0, 0.34));
      animation: logo-rush-body 720ms cubic-bezier(0.18, 0.76, 0.17, 1) infinite;
    }

    .sidebar-row--supericons:hover .supericons-motion__trail--1 {
      animation: logo-speed-trail 720ms cubic-bezier(0.18, 0.76, 0.17, 1) 0ms infinite;
    }

    .sidebar-row--supericons:hover .supericons-motion__trail--2 {
      animation: logo-speed-trail 720ms cubic-bezier(0.18, 0.76, 0.17, 1) 90ms infinite;
    }

    .sidebar-row--supericons:hover .supericons-motion__trail--3 {
      animation: logo-speed-trail 720ms cubic-bezier(0.18, 0.76, 0.17, 1) 180ms infinite;
    }

    .sidebar-row--supericons:hover .supericons-speed-streak--1 {
      animation: logo-speed-streak 540ms cubic-bezier(0.2, 0.78, 0.16, 1) 0ms infinite;
    }

    .sidebar-row--supericons:hover .supericons-speed-streak--2 {
      animation: logo-speed-streak 540ms cubic-bezier(0.2, 0.78, 0.16, 1) 55ms infinite;
    }

    .sidebar-row--supericons:hover .supericons-speed-streak--3 {
      animation: logo-speed-streak 540ms cubic-bezier(0.2, 0.78, 0.16, 1) 115ms infinite;
    }

    .sidebar-row--supericons:hover .supericons-speed-streak--4 {
      animation: logo-speed-streak-short 540ms cubic-bezier(0.2, 0.78, 0.16, 1) 180ms infinite;
    }

    @keyframes logo-rush-body {
      0%, 100% {
        transform: translateX(0) scaleX(1);
      }
      18% {
        transform: translateX(3px) scaleX(1.08);
      }
      34% {
        transform: translateX(-1px) scaleX(0.96);
      }
      58% {
        transform: translateX(1.2px) scaleX(1.03);
      }
    }

    @keyframes logo-speed-trail {
      0% {
        opacity: 0;
        transform: translateX(-13px) scaleX(0.55);
      }
      20% {
        opacity: 0.48;
        transform: translateX(-9px) scaleX(0.72);
      }
      48% {
        opacity: 0.25;
        transform: translateX(-3px) scaleX(0.92);
      }
      72%, 100% {
        opacity: 0;
        transform: translateX(3px) scaleX(1);
      }
    }

    @keyframes logo-speed-streak {
      0% {
        opacity: 0;
        transform: translateX(-7px) scaleX(0.18);
      }
      18% {
        opacity: 0.92;
        transform: translateX(-3px) scaleX(1);
      }
      52% {
        opacity: 0.55;
        transform: translateX(6px) scaleX(0.58);
      }
      76%, 100% {
        opacity: 0;
        transform: translateX(11px) scaleX(0.12);
      }
    }

    @keyframes logo-speed-streak-short {
      0% {
        opacity: 0;
        transform: translateX(-4px) scaleX(0.2);
      }
      24% {
        opacity: 0.72;
        transform: translateX(0) scaleX(0.88);
      }
      66%, 100% {
        opacity: 0;
        transform: translateX(8px) scaleX(0.18);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .sidebar-row--supericons:hover .supericons-motion,
      .sidebar-row--supericons:hover .supericons-motion__trail,
      .sidebar-row--supericons:hover .supericons-speed-streak {
        animation: none;
      }
    }
  </style>
</head>
