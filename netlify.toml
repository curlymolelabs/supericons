# Netlify configuration for Supericons

[build]
  command = "npm run build"
  publish = "dist"

# Keep the MCP landing page as a real static page for search engines, MCP
# directories, and manual sharing. The general SPA fallback below still handles
# app-only routes.
[[redirects]]
  from = "/mcp"
  to = "/mcp/"
  status = 301

# Keep docs hub as a real static document before the SPA fallback.
[[redirects]]
  from = "/docs"
  to = "/docs/index.html"
  status = 200

[[redirects]]
  from = "/docs/"
  to = "/docs/index.html"
  status = 200

# Keep the old x402 single-icon license URL working after the license moved into Terms.
[[redirects]]
  from = "/legal/supericons-single-icon-license"
  to = "/terms/#single-icon-license"
  status = 301

[[redirects]]
  from = "/legal/supericons-single-icon-license/"
  to = "/terms/#single-icon-license"
  status = 301

# SPA routing: serve index.html for all paths
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache static assets aggressively
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, immutable"

[[headers]]
  for = "*.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
