<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="bg-model" x1="60" y1="4" x2="60" y2="116" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C4B5FD"/>
      <stop offset="1" stop-color="#5B21B6"/>
    </linearGradient>
    <linearGradient id="shine-model" x1="60" y1="4" x2="60" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="squircle-model">
      <rect x="4" y="4" width="112" height="112" rx="26"/>
    </clipPath>
  </defs>

  <!-- Background squircle -->
  <rect x="4" y="4" width="112" height="112" rx="26" fill="url(#bg-model)"/>

  <!-- Glass highlight -->
  <rect x="4" y="4" width="112" height="56" rx="26" fill="url(#shine-model)" clip-path="url(#squircle-model)"/>

  <!-- Inner shadow (subtle) -->
  <rect x="4" y="58" width="112" height="58" rx="4" fill="rgba(0,0,0,0.08)" clip-path="url(#squircle-model)"/>

  <!-- Icon shape (centered, scaled, white) -->
  <g transform="translate(30, 30) scale(2.5)" fill="#fff" fill-opacity="0.95">
    <path d="M12 2a7 7 0 017 7c0 5-7 9-7 13 0-4-7-8-7-13a7 7 0 017-7z"/><circle cx="12" cy="8" r="1.5" fill="rgba(0,0,0,0.15)"/>
  </g>
</svg>