<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="bg-temperature" x1="60" y1="4" x2="60" y2="116" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C4B5FD"/>
      <stop offset="1" stop-color="#5B21B6"/>
    </linearGradient>
    <linearGradient id="shine-temperature" x1="60" y1="4" x2="60" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="squircle-temperature">
      <rect x="4" y="4" width="112" height="112" rx="26"/>
    </clipPath>
  </defs>

  <!-- Background squircle -->
  <rect x="4" y="4" width="112" height="112" rx="26" fill="url(#bg-temperature)"/>

  <!-- Glass highlight -->
  <rect x="4" y="4" width="112" height="56" rx="26" fill="url(#shine-temperature)" clip-path="url(#squircle-temperature)"/>

  <!-- Inner shadow (subtle) -->
  <rect x="4" y="58" width="112" height="58" rx="4" fill="rgba(0,0,0,0.08)" clip-path="url(#squircle-temperature)"/>

  <!-- Icon shape (centered, scaled, white) -->
  <g transform="translate(30, 30) scale(2.5)" fill="#fff" fill-opacity="0.95">
    <path fill-rule="evenodd" d="M14 14.76V3.5a2.5 2.5 0 10-5 0v11.26a4.5 4.5 0 105 0zm-2.5-2.01a.75.75 0 01.75.75V17a2 2 0 11-1.5 0v-3.5a.75.75 0 01.75-.75z" clip-rule="evenodd"/>
