<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="bg-streaming" x1="60" y1="4" x2="60" y2="116" gradientUnits="userSpaceOnUse">
      <stop stop-color="#93C5FD"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="shine-streaming" x1="60" y1="4" x2="60" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="squircle-streaming">
      <rect x="4" y="4" width="112" height="112" rx="26"/>
    </clipPath>
  </defs>

  <!-- Background squircle -->
  <rect x="4" y="4" width="112" height="112" rx="26" fill="url(#bg-streaming)"/>

  <!-- Glass highlight -->
  <rect x="4" y="4" width="112" height="56" rx="26" fill="url(#shine-streaming)" clip-path="url(#squircle-streaming)"/>

  <!-- Inner shadow (subtle) -->
  <rect x="4" y="58" width="112" height="58" rx="4" fill="rgba(0,0,0,0.08)" clip-path="url(#squircle-streaming)"/>

  <!-- Icon shape (centered, scaled, white) -->
  <g transform="translate(30, 30) scale(2.5)" fill="#fff" fill-opacity="0.95">
    <circle cx="5" cy="12" r="2.5"/><circle cx="12" cy="12" r="2.5"/><circle cx="19" cy="12" r="2.5"/>
  </g>
</svg>