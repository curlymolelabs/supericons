<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- Glass background gradient -->
    <linearGradient id="tooluse_bg" x1="20" y1="8" x2="100" y2="112" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2d1b4e" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#1a0e2e" stop-opacity="0.95"/>
    </linearGradient>
    <!-- Border gradient (frosted edge) -->
    <linearGradient id="tooluse_border" x1="60" y1="4" x2="60" y2="116" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.05"/>
    </linearGradient>
    <!-- Inner glow -->
    <radialGradient id="tooluse_glow" cx="60" cy="50" r="50" gradientUnits="userSpaceOnUse">
      <stop stop-color="#CE93D8" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#CE93D8" stop-opacity="0"/>
    </radialGradient>
    <!-- Specular highlight (top shine) -->
    <linearGradient id="tooluse_shine" x1="60" y1="4" x2="60" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <!-- Clip for squircle -->
    <clipPath id="tooluse_clip">
      <rect x="4" y="4" width="112" height="112" rx="26"/>
    </clipPath>
    <!-- Drop shadow filter -->
    <filter id="tooluse_shadow" x="-20%" y="-10%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#B39DDB" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Layer 1: Ambient shadow -->
  <rect x="4" y="4" width="112" height="112" rx="26" fill="transparent" filter="url(#tooluse_shadow)"/>

  <!-- Layer 2: Glass background -->
  <rect x="4" y="4" width="112" height="112" rx="26" fill="url(#tooluse_bg)"/>

  <!-- Layer 3: Frosted border -->
  <rect x="4" y="4" width="112" height="112" rx="26" fill="none" stroke="url(#tooluse_border)" stroke-width="1"/>

  <!-- Layer 4: Inner glow -->
  <circle cx="60" cy="50" r="50" fill="url(#tooluse_glow)" clip-path="url(#tooluse_clip)"/>

  <!-- Layer 5: Specular top shine -->
  <rect x="4" y="4" width="112" height="56" fill="url(#tooluse_shine)" clip-path="url(#tooluse_clip)"/>

  <!-- Layer 6: Icon (scaled from 256x256 to 64x64, centered in glass) -->
  <g transform="translate(28, 28) scale(0.25)" fill="#B39DDB" fill-opacity="0.9">
    <path d="M232 96a72 72 0 0 1-100.94 66L79 222.22c-.12.14-.26.29-.39.42a32 32 0 0 1-45.26-45.26c.14-.13.28-.27.43-.39L94 124.94a72.07 72.07 0 0 1 83.54-98.78a8 8 0 0 1 3.93 13.19L144 80l5.66 26.35L176 112l40.65-37.52a8 8 0 0 1 13.19 3.93A72.6 72.6 0 0 1 232 96"/>
  </g>
</svg>