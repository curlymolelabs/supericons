<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- Glass background gradient -->
    <linearGradient id="chain_bg" x1="20" y1="8" x2="100" y2="112" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2d1b4e" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#1a0e2e" stop-opacity="0.95"/>
    </linearGradient>
    <!-- Border gradient (frosted edge) -->
    <linearGradient id="chain_border" x1="60" y1="4" x2="60" y2="116" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.05"/>
    </linearGradient>
    <!-- Inner glow -->
    <radialGradient id="chain_glow" cx="60" cy="50" r="50" gradientUnits="userSpaceOnUse">
      <stop stop-color="#CE93D8" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#CE93D8" stop-opacity="0"/>
    </radialGradient>
    <!-- Specular highlight (top shine) -->
    <linearGradient id="chain_shine" x1="60" y1="4" x2="60" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <!-- Clip for squircle -->
    <clipPath id="chain_clip">
      <rect x="4" y="4" width="112" height="112" rx="26"/>
    </clipPath>
    <!-- Drop shadow filter -->
    <filter id="chain_shadow" x="-20%" y="-10%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#B39DDB" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Layer 1: Ambient shadow -->
  <rect x="4" y="4" width="112" height="112" rx="26" fill="transparent" filter="url(#chain_shadow)"/>

  <!-- Layer 2: Glass background -->
  <rect x="4" y="4" width="112" height="112" rx="26" fill="url(#chain_bg)"/>

  <!-- Layer 3: Frosted border -->
  <rect x="4" y="4" width="112" height="112" rx="26" fill="none" stroke="url(#chain_border)" stroke-width="1"/>

  <!-- Layer 4: Inner glow -->
  <circle cx="60" cy="50" r="50" fill="url(#chain_glow)" clip-path="url(#chain_clip)"/>

  <!-- Layer 5: Specular top shine -->
  <rect x="4" y="4" width="112" height="56" fill="url(#chain_shine)" clip-path="url(#chain_clip)"/>

  <!-- Layer 6: Icon (scaled from 256x256 to 64x64, centered in glass) -->
  <g transform="translate(28, 28) scale(0.25)" fill="#B39DDB" fill-opacity="0.9">
    <path d="M117.18 188.74a12 12 0 0 1 0 17l-5.12 5.12A58.26 58.26 0 0 1 70.6 228a58.62 58.62 0 0 1-41.46-100.08l34.75-34.75a58.64 58.64 0 0 1 98.56 28.11a12 12 0 1 1-23.37 5.44a34.65 34.65 0 0 0-58.22-16.58l-34.75 34.75A34.62 34.62 0 0 0 70.57 204a34.4 34.4 0 0 0 24.49-10.14l5.11-5.12a12 12 0 0 1 17.01 0M226.83 45.17a58.65 58.65 0 0 0-82.93 0l-5.11 5.11a12 12 0 0 0 17 17l5.12-5.12a34.63 34.63 0 1 1 49 49l-34.81 34.7A34.4 34.4 0 0 1 150.61 156a34.63 34.63 0 0 1-33.69-26.72a12 12 0 0 0-23.38 5.44A58.64 58.64 0 0 0 150.56 180h.05a58.28 58.28 0 0 0 41.47-17.17l34.75-34.75a58.62 58.62 0 0 0 0-82.91"/>
  </g>
</svg>