<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-width="1.5" fill="none" width="64" height="64" id="animated-icon"><style>/* Supericons Motion Lab */
/* Animation: shake | Trigger: loop | Duration: 900ms */

@keyframes ml-icon {
  0% {
    transform: translateX(0px) scale(1.1) rotate(131deg);
  }
  15% {
    transform: translateX(-1.95px) scale(1.1) rotate(131deg);
  }
  30% {
    transform: translateX(1.95px) scale(1.1) rotate(131deg);
  }
  45% {
    transform: translateX(-1.95px) scale(1.1) rotate(131deg);
  }
  60% {
    transform: translateX(1.95px) scale(1.1) rotate(131deg);
  }
  75% {
    transform: translateX(-1.30px) scale(1.1) rotate(131deg);
  }
  100% {
    transform: translateX(0px) scale(1.1) rotate(131deg);
  }
}
#animated-icon {
  animation: ml-icon 900ms ease-out infinite;
}

/* Static overrides */
#animated-icon {
  transform: scale(1.1) rotate(131deg);
  transform-origin: center;
  opacity: 0.8;
}

