<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="si-icon si-anim-dc si-dc-distribution">
  <!-- Axis -->
  <line class="dc-axis" x1="2" y1="20" x2="22" y2="20" stroke="#3B82F6" stroke-width="1.0" stroke-opacity="0.50"/>
  <!-- Bell curve area -->
  <path class="dc-area" d="M2 20 Q4 19 6 17 Q8 13 10 8 Q11 5 12 4 Q13 5 14 8 Q16 13 18 17 Q20 19 22 20 Z" fill="#3B82F6" fill-opacity="0.26"/>
  <!-- Bell curve line -->
  <path class="dc-curve" d="M2 20 Q4 19 6 17 Q8 13 10 8 Q11 5 12 4 Q13 5 14 8 Q16 13 18 17 Q20 19 22 20" fill="none" stroke="#3B82F6" stroke-width="1.2" stroke-opacity="1.00" stroke-linecap="round"/>
  <!-- Mean line -->
  <line class="dc-mean" x1="12" y1="4" x2="12" y2="20" stroke="#3B82F6" stroke-width="1.0" stroke-opacity="0.75" stroke-dasharray="1.5 1"/>
  <!-- Peak dot -->
  <circle class="dc-peak" cx="12" cy="4" r="1.5" fill="#3B82F6" fill-opacity="1.00"/>
</svg>
