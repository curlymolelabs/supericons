<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="si-icon si-anim-dc si-dc-snapshot">
  <!-- Frame/viewfinder -->
  <rect class="dc-frame" x="2" y="4" width="20" height="16" rx="2" fill="#3B82F6" fill-opacity="0.13" stroke="#3B82F6" stroke-width="1.5" stroke-opacity="0.75"/>
  <!-- Corner brackets -->
  <path class="dc-bracket dc-bracket-1" d="M5 7 L5 5 L8 5" fill="none" stroke="#3B82F6" stroke-width="1" stroke-opacity="1.00" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="dc-bracket dc-bracket-2" d="M19 7 L19 5 L16 5" fill="none" stroke="#3B82F6" stroke-width="1" stroke-opacity="1.00" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="dc-bracket dc-bracket-3" d="M5 17 L5 19 L8 19" fill="none" stroke="#3B82F6" stroke-width="1" stroke-opacity="1.00" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="dc-bracket dc-bracket-4" d="M19 17 L19 19 L16 19" fill="none" stroke="#3B82F6" stroke-width="1" stroke-opacity="1.00" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Mini chart inside snapshot -->
  <rect x="8" y="13" width="2" height="4" fill="#3B82F6" fill-opacity="0.77"/>
  <rect x="11" y="10" width="2" height="7" fill="#3B82F6" fill-opacity="1.00"/>
  <rect x="14" y="11.5" width="2" height="5.5" fill="#3B82F6" fill-opacity="0.99"/>
  <!-- Flash dot -->
  <circle class="dc-flash" cx="12" cy="3" r="1" fill="#3B82F6" fill-opacity="1.00"/>
</svg>
