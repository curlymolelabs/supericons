<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="si-icon si-anim-dc si-dc-anomaly">
  <!-- Axis -->
  <line class="dc-axis" x1="3" y1="20" x2="21" y2="20" stroke="#3B82F6" stroke-width="1.0" stroke-opacity="0.50"/>
  <!-- Normal line -->
  <polyline class="dc-line" points="3,14 6,13 9,14 12,13 15,14 18,13 21,14" fill="none" stroke="#3B82F6" stroke-width="1" stroke-opacity="0.88" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Normal dots -->
  <circle cx="3" cy="14" r="0.8" fill="#3B82F6" fill-opacity="0.66"/>
  <circle cx="6" cy="13" r="0.8" fill="#3B82F6" fill-opacity="0.66"/>
  <circle cx="9" cy="14" r="0.8" fill="#3B82F6" fill-opacity="0.66"/>
  <circle cx="15" cy="14" r="0.8" fill="#3B82F6" fill-opacity="0.66"/>
  <circle cx="18" cy="13" r="0.8" fill="#3B82F6" fill-opacity="0.66"/>
  <circle cx="21" cy="14" r="0.8" fill="#3B82F6" fill-opacity="0.66"/>
  <!-- Anomaly spike -->
  <line class="dc-spike" x1="12" y1="13" x2="12" y2="4" stroke="#3B82F6" stroke-width="1" stroke-opacity="1.00" stroke-linecap="round"/>
  <circle class="dc-anomaly" cx="12" cy="4" r="2" fill="#3B82F6" fill-opacity="0.33" stroke="#3B82F6" stroke-width="1" stroke-opacity="1.00"/>
  <!-- Alert indicator -->
  <line x1="12" y1="3" x2="12" y2="5" stroke="#3B82F6" stroke-width="1.2" stroke-opacity="1.00" stroke-linecap="round"/>
</svg>
