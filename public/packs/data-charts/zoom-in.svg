<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="si-icon si-anim-dc si-dc-zoom-in">
  <!-- Magnifier circle -->
  <circle class="dc-lens" cx="10" cy="10" r="7" fill="#3B82F6" fill-opacity="0.13" stroke="#3B82F6" stroke-width="1" stroke-opacity="1.00"/>
  <!-- Plus sign -->
  <line class="dc-plus" x1="10" y1="7" x2="10" y2="13" stroke="#3B82F6" stroke-width="1.2" stroke-opacity="1.00" stroke-linecap="round"/>
  <line class="dc-plus" x1="7" y1="10" x2="13" y2="10" stroke="#3B82F6" stroke-width="1.2" stroke-opacity="1.00" stroke-linecap="round"/>
  <!-- Handle -->
  <line class="dc-handle" x1="15" y1="15" x2="21" y2="21" stroke="#3B82F6" stroke-width="1.5" stroke-opacity="1.00" stroke-linecap="round"/>
</svg>
