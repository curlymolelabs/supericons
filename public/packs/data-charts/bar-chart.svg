<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="si-icon si-anim-dc si-dc-bar-chart">
  <!-- Axis lines -->
  <line class="dc-axis" x1="3" y1="20" x2="21" y2="20" stroke="#3B82F6" stroke-width="0.6" stroke-opacity="0.38"/>
  <line class="dc-axis" x1="3" y1="4" x2="3" y2="20" stroke="#3B82F6" stroke-width="0.6" stroke-opacity="0.38"/>
  <!-- Grid hints -->
  <line x1="3" y1="14" x2="21" y2="14" stroke="#3B82F6" stroke-width="0.4" stroke-opacity="0.15"/>
  <line x1="3" y1="8" x2="21" y2="8" stroke="#3B82F6" stroke-width="0.4" stroke-opacity="0.15"/>
  <!-- Bars: thin outline, tonal fill -->
  <rect class="dc-bar dc-bar-1" x="5" y="14" width="3.5" height="6" rx="0.3" fill="#3B82F6" fill-opacity="0.66" stroke="#3B82F6" stroke-width="0.6" stroke-opacity="0.38"/>
  <rect class="dc-bar dc-bar-2" x="10" y="8" width="3.5" height="12" rx="0.3" fill="#3B82F6" fill-opacity="1.00" stroke="#3B82F6" stroke-width="0.6" stroke-opacity="0.50"/>
  <rect class="dc-bar dc-bar-3" x="15" y="5" width="3.5" height="15" rx="0.3" fill="#3B82F6" fill-opacity="1.00" stroke="#3B82F6" stroke-width="0.6" stroke-opacity="0.75"/>
</svg>
