<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="si-icon si-anim-dc si-dc-spreadsheet">
  <!-- Frame -->
  <rect class="dc-frame" x="2" y="2" width="20" height="20" rx="1.5" fill="none" stroke="#3B82F6" stroke-width="1.0" stroke-opacity="0.38"/>
  <!-- Header column -->
  <rect class="dc-header-col" x="2" y="2" width="5" height="20" rx="1" fill="#3B82F6" fill-opacity="0.33"/>
  <!-- Header row -->
  <rect class="dc-header-row" x="2" y="2" width="20" height="4" rx="1" fill="#3B82F6" fill-opacity="0.77"/>
  <!-- Active cell highlight -->
  <rect class="dc-active" x="8" y="7" width="6" height="4" fill="#3B82F6" fill-opacity="1.00" stroke="#3B82F6" stroke-width="1.5" stroke-opacity="1.00"/>
  <!-- Grid lines -->
  <line x1="7" y1="6" x2="7" y2="22" stroke="#3B82F6" stroke-width="0.6" stroke-opacity="0.25"/>
  <line x1="14" y1="6" x2="14" y2="22" stroke="#3B82F6" stroke-width="0.6" stroke-opacity="0.25"/>
  <line x1="7" y1="11" x2="22" y2="11" stroke="#3B82F6" stroke-width="0.6" stroke-opacity="0.25"/>
  <line x1="7" y1="15" x2="22" y2="15" stroke="#3B82F6" stroke-width="0.6" stroke-opacity="0.25"/>
  <line x1="7" y1="19" x2="22" y2="19" stroke="#3B82F6" stroke-width="0.6" stroke-opacity="0.25"/>
</svg>
