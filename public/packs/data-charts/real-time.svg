<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="si-icon si-anim-dc si-dc-real-time">
  <!-- Background pulse ring -->
  <circle class="dc-pulse dc-pulse-1" cx="5" cy="12" r="3" fill="none" stroke="#3B82F6" stroke-width="1.0" stroke-opacity="0.25"/>
  <circle class="dc-pulse dc-pulse-2" cx="5" cy="12" r="5" fill="none" stroke="#3B82F6" stroke-width="0.6" stroke-opacity="0.15"/>
  <!-- Live dot -->
  <circle class="dc-live" cx="5" cy="12" r="1.5" fill="#3B82F6" fill-opacity="1.00"/>
  <!-- Streaming line -->
  <polyline class="dc-stream" points="8,12 11,8 13,14 15,6 17,16 19,10 21,12" fill="none" stroke="#3B82F6" stroke-width="1" stroke-opacity="1.00" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Grid lines -->
  <line x1="8" y1="6" x2="8" y2="18" stroke="#3B82F6" stroke-width="0.6" stroke-opacity="0.20"/>
  <line x1="8" y1="6" x2="21" y2="6" stroke="#3B82F6" stroke-width="0.6" stroke-opacity="0.20"/>
  <line x1="8" y1="18" x2="21" y2="18" stroke="#3B82F6" stroke-width="0.6" stroke-opacity="0.20"/>
</svg>
