<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="si-icon si-anim-dc si-dc-line-chart">
  <!-- Axis -->
  <line class="dc-axis" x1="3" y1="20" x2="21" y2="20" stroke="#3B82F6" stroke-width="0.6" stroke-opacity="0.38"/>
  <line class="dc-axis" x1="3" y1="4" x2="3" y2="20" stroke="#3B82F6" stroke-width="0.6" stroke-opacity="0.38"/>
  <!-- Area fill under the line -->
  <path class="dc-area" d="M4 16 L8 12 L12 14 L16 7 L20 9 L20 20 L4 20 Z" fill="#3B82F6" fill-opacity="0.13"/>
  <!-- Line: thin 0.5px -->
  <polyline class="dc-line" points="4,16 8,12 12,14 16,7 20,9" fill="none" stroke="#3B82F6" stroke-width="1.0" stroke-opacity="1.00" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Small dots at vertices -->
  <circle class="dc-dot dc-dot-1" cx="4" cy="16" r="0.8" fill="#3B82F6" fill-opacity="0.77"/>
  <circle class="dc-dot dc-dot-2" cx="8" cy="12" r="0.8" fill="#3B82F6" fill-opacity="1.00"/>
  <circle class="dc-dot dc-dot-3" cx="12" cy="14" r="0.8" fill="#3B82F6" fill-opacity="1.00"/>
  <circle class="dc-dot dc-dot-4" cx="16" cy="7" r="0.8" fill="#3B82F6" fill-opacity="1.00"/>
  <circle class="dc-dot dc-dot-5" cx="20" cy="9" r="0.8" fill="#3B82F6" fill-opacity="1.00"/>
</svg>
