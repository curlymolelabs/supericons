<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="si-icon si-anim-dc si-dc-dashboard">
  <!-- Frame -->
  <rect class="dc-frame" x="1" y="1" width="22" height="22" rx="2" fill="none" stroke="#3B82F6" stroke-width="1.0" stroke-opacity="0.38"/>
  <!-- Panel 1: mini bar chart (top left) -->
  <rect class="dc-panel dc-panel-1" x="2.5" y="2.5" width="9" height="9" rx="1" fill="#3B82F6" fill-opacity="0.13"/>
  <rect class="dc-mini-bar" x="4" y="7" width="1.5" height="3.5" fill="#3B82F6" fill-opacity="0.88"/>
  <rect class="dc-mini-bar" x="6" y="5" width="1.5" height="5.5" fill="#3B82F6" fill-opacity="1.00"/>
  <rect class="dc-mini-bar" x="8" y="4" width="1.5" height="6.5" fill="#3B82F6" fill-opacity="1.00"/>
  <!-- Panel 2: mini line (top right) -->
  <rect class="dc-panel dc-panel-2" x="12.5" y="2.5" width="9" height="9" rx="1" fill="#3B82F6" fill-opacity="0.13"/>
  <polyline class="dc-mini-line" points="14,9 16,6 18,7.5 20,4" fill="none" stroke="#3B82F6" stroke-width="1.5" stroke-opacity="1.00" stroke-linecap="round"/>
  <!-- Panel 3: number (bottom left) -->
  <rect class="dc-panel dc-panel-3" x="2.5" y="12.5" width="9" height="9" rx="1" fill="#3B82F6" fill-opacity="0.13"/>
  <circle cx="7" cy="17" r="3" fill="#3B82F6" fill-opacity="0.66"/>
  <circle cx="7" cy="17" r="1" fill="#3B82F6" fill-opacity="1.00"/>
  <!-- Panel 4: gauge (bottom right) -->
  <rect class="dc-panel dc-panel-4" x="12.5" y="12.5" width="9" height="9" rx="1" fill="#3B82F6" fill-opacity="0.13"/>
  <path d="M14.5 19.5 A3.5 3.5 0 0 1 19.5 19.5" fill="none" stroke="#3B82F6" stroke-width="1.5" stroke-opacity="1.00" stroke-linecap="round"/>
  <line x1="17" y1="19.5" x2="18.5" y2="16" stroke="#3B82F6" stroke-width="1.5" stroke-opacity="1.00" stroke-linecap="round"/>
</svg>
