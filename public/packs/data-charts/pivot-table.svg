  <!-- Pivot arrows -->
  <path class="dc-pivot-arrow" d="M7 4 L7 7 L4 7" fill="none" stroke="#3B82F6" stroke-width="1" stroke-opacity="1.00" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Header col -->
  <rect class="dc-header" x="2" y="2" width="5" height="20" rx="1" fill="#3B82F6" fill-opacity="0.44"/>
