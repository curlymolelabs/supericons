  <!-- Data cells -->
  <rect class="dc-cell dc-cell-1" x="8" y="8" width="5" height="5" rx="0.5" fill="#3B82F6" fill-opacity="1.00"/>
  <rect class="dc-cell dc-cell-2" x="14" y="8" width="7" height="5" rx="0.5" fill="#3B82F6" fill-opacity="0.66"/>
  <rect class="dc-cell dc-cell-3" x="8" y="14" width="5" height="7" rx="0.5" fill="#3B82F6" fill-opacity="0.33"/>
  <rect class="dc-cell dc-cell-4" x="14" y="14" width="7" height="7" rx="0.5" fill="#3B82F6" fill-opacity="1.00"/>
</svg>
