<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="si-icon si-anim-dc si-dc-forecast">
  <!-- Axis -->
  <line class="dc-axis" x1="3" y1="20" x2="21" y2="20" stroke="#3B82F6" stroke-width="1.0" stroke-opacity="0.50"/>
  <line class="dc-axis" x1="3" y1="4" x2="3" y2="20" stroke="#3B82F6" stroke-width="1.0" stroke-opacity="0.50"/>
  <!-- Actual data (solid) -->
  <polyline class="dc-actual" points="4,16 7,13 10,14 13,10" fill="none" stroke="#3B82F6" stroke-width="1.2" stroke-opacity="1.00" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Divider (now) -->
  <line class="dc-divider" x1="13" y1="4" x2="13" y2="20" stroke="#3B82F6" stroke-width="1.0" stroke-opacity="0.50" stroke-dasharray="1.5 1.5"/>
  <!-- Forecast data (dashed) -->
  <polyline class="dc-forecast" points="13,10 16,8 19,6 21,5" fill="none" stroke="#3B82F6" stroke-width="1.2" stroke-opacity="1.00" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 2"/>
  <!-- Confidence cone -->
  <path class="dc-cone" d="M13 10 L21 3 L21 9 Z" fill="#3B82F6" fill-opacity="0.13"/>
  <!-- Current dot -->
  <circle class="dc-now" cx="13" cy="10" r="1.5" fill="#3B82F6" fill-opacity="1.00"/>
</svg>
