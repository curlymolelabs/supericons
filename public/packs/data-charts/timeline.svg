<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="si-icon si-anim-dc si-dc-timeline">
  <!-- Main line -->
  <line class="dc-line" x1="3" y1="12" x2="21" y2="12" stroke="#3B82F6" stroke-width="1.5" stroke-opacity="0.50"/>
  <!-- Timeline points -->
  <circle class="dc-point dc-point-1" cx="4" cy="12" r="1.5" fill="#3B82F6" fill-opacity="0.55"/>
  <circle class="dc-point dc-point-2" cx="8.5" cy="12" r="1.5" fill="#3B82F6" fill-opacity="0.88"/>
  <circle class="dc-point dc-point-3" cx="13" cy="12" r="2" fill="#3B82F6" fill-opacity="1.00"/>
  <circle class="dc-point dc-point-4" cx="17.5" cy="12" r="1.5" fill="#3B82F6" fill-opacity="1.00"/>
  <circle class="dc-point dc-point-5" cx="21" cy="12" r="1.5" fill="#3B82F6" fill-opacity="1.00"/>
  <!-- Labels (tick marks) -->
  <line x1="4" y1="15" x2="4" y2="17" stroke="#3B82F6" stroke-width="1.0" stroke-opacity="0.38"/>
  <line x1="8.5" y1="15" x2="8.5" y2="17" stroke="#3B82F6" stroke-width="1.0" stroke-opacity="0.38"/>
  <line x1="13" y1="15" x2="13" y2="17" stroke="#3B82F6" stroke-width="1.0" stroke-opacity="0.38"/>
  <line x1="17.5" y1="15" x2="17.5" y2="17" stroke="#3B82F6" stroke-width="1.0" stroke-opacity="0.38"/>
  <line x1="21" y1="15" x2="21" y2="17" stroke="#3B82F6" stroke-width="1.0" stroke-opacity="0.38"/>
  <!-- Connecting risers -->
  <line x1="4" y1="10" x2="4" y2="8" stroke="#3B82F6" stroke-width="1.0" stroke-opacity="0.38"/>
  <line x1="13" y1="9.5" x2="13" y2="7" stroke="#3B82F6" stroke-width="1.0" stroke-opacity="0.75"/>
</svg>
