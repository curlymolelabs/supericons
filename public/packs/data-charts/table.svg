  <!-- Header row -->
  <rect class="dc-header" x="2" y="3" width="20" height="4" rx="1.5" fill="#3B82F6" fill-opacity="1.00"/>
  <!-- Rows -->
  <rect class="dc-row dc-row-1" x="3" y="8.5" width="18" height="3" rx="0.5" fill="#3B82F6" fill-opacity="0.18"/>
  <rect class="dc-row dc-row-2" x="3" y="12.5" width="18" height="3" rx="0.5" fill="#3B82F6" fill-opacity="0.33"/>
  <rect class="dc-row dc-row-3" x="3" y="16.5" width="18" height="3" rx="0.5" fill="#3B82F6" fill-opacity="0.18"/>
  <!-- Column dividers -->
  <line x1="9" y1="7" x2="9" y2="21" stroke="#3B82F6" stroke-width="0.6" stroke-opacity="0.25"/>
  <line x1="16" y1="7" x2="16" y2="21" stroke="#3B82F6" stroke-width="0.6" stroke-opacity="0.25"/>
</svg>
